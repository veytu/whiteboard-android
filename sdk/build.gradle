apply plugin: 'com.android.library'

android {
    namespace = "com.herewhite.sdk"
    compileSdkVersion 31

    defaultConfig {
        minSdkVersion 20
        targetSdkVersion 31
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField("String", "LIB_VERSION", '"' + rootProject.ext.moduleVersionConfig.whiteboard.prodVersionName + '"')
            buildConfigField("int", "LIB_VERSION_CODE", String.valueOf(rootProject.ext.moduleVersionConfig.whiteboard.prodVersionCode))
            resValue "string", "lib_version", rootProject.ext.moduleVersionConfig.whiteboard.prodVersionName
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField("String", "LIB_VERSION", '"' + rootProject.ext.moduleVersionConfig.whiteboard.nonProdVersionName + '"')
            buildConfigField("int", "LIB_VERSION_CODE", String.valueOf(rootProject.ext.moduleVersionConfig.whiteboard.nonProdVersionCode))
            resValue "string", "lib_version", rootProject.ext.moduleVersionConfig.whiteboard.nonProdVersionName
        }
        envTest {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField("String", "LIB_VERSION", '"' + rootProject.ext.moduleVersionConfig.whiteboard.nonProdVersionName + '"')
            buildConfigField("int", "LIB_VERSION_CODE", String.valueOf(rootProject.ext.moduleVersionConfig.whiteboard.nonProdVersionCode))
            resValue "string", "lib_version", rootProject.ext.moduleVersionConfig.whiteboard.nonProdVersionName
        }
        envUat {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField("String", "LIB_VERSION", '"' + rootProject.ext.moduleVersionConfig.whiteboard.nonProdVersionName + '"')
            buildConfigField("int", "LIB_VERSION_CODE", String.valueOf(rootProject.ext.moduleVersionConfig.whiteboard.nonProdVersionCode))
            resValue "string", "lib_version", rootProject.ext.moduleVersionConfig.whiteboard.nonProdVersionName
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig = true
    }

    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:unchecked"
    }
}

dependencies {
    api 'com.google.code.gson:gson:2.10.1'
    api 'com.squareup.okhttp3:okhttp:4.11.0'
    api 'com.github.netless-io:DSBridge-Android:nl_dsb_v3.0.4'
    api "androidx.annotation:annotation:1.1.0"
}
